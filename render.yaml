services:
  - type: web
    name: bybit-intraday-trading-bot-frontend
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run typecheck && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_API_URL
        value: https://bybit-intraday-trading-bot.onrender.com
      - key: BACKEND_ADMIN_TOKEN
        sync: false
