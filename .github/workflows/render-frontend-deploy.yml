name: Render Frontend Deploy CI

on:
  pull_request:
    paths:
      - "render-server.ts"
      - "render.yaml"
      - "package.json"
      - "api/**"
      - "src/**"
      - ".github/workflows/render-frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Verify Render server imports
        run: node --import tsx -e "import('./render-server.ts').then(() => setTimeout(() => process.exit(0), 500))"
        env:
          PORT: "11000"
          NODE_ENV: production
          BACKEND_ADMIN_TOKEN: ci-placeholder
