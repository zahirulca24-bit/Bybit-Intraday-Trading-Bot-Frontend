name: Historical Replay Cloud Run E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-cloud-run-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-cloud-run-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Typecheck, build and run full Cloud Run BFF replay E2E
        run: npm run verify

      - name: Verify Cloud Run container contract
        run: |
          grep -F 'CMD ["npm", "start"]' Dockerfile
          grep -F 'EXPOSE 8080' Dockerfile
          grep -F 'cloud-run-server.ts' Dockerfile
          grep -F 'app.all("/api/replay/*"' cloud-run-server.ts

      - name: Verify browser bundle cannot contain backend credentials
        run: |
          if grep -R "BACKEND_ADMIN_TOKEN\|step9-e2e-secret" dist; then
            echo "Server-only credential marker leaked into the browser build."
            exit 1
          fi
