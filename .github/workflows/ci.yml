name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npm run typecheck
      - run: npm run test:auth
      - run: npm run test:scanner
      - run: npm run test:lifecycle
      - run: npm run test:execution-truth
      - run: npm run test:ui-verification
      - run: npm run test:cloud-run
      - run: npm run build
      - run: npm audit --audit-level=high --package-lock=false

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Test-only credentials — no real Bybit credentials
      FRONTEND_OPERATOR_PASSWORD_SCRYPT: "scrypt$e2etestsalt0000000000000000000001$3257258a2d423026e399233b5fc95c9c96ea1dfed7f17983d507d7f6adbafc53"
      FRONTEND_SESSION_SIGNING_SECRET: "e2e-test-session-signing-secret-not-production-64chars-padding-1234"
      BACKEND_API_URL: "http://127.0.0.1:19201"
      BACKEND_ADMIN_TOKEN: "e2e-playwright-backend-token"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run historical replay E2E
        run: node e2e/run-e2e-wrapper.mjs
      - name: Run Playwright operator journey E2E
        run: npm run test:e2e:playwright
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          # Do not upload secrets, cookies, or sensitive payloads
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
