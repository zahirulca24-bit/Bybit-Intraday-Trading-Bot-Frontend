name: Risk Controls Contract Sync CI

on:
  pull_request:
    paths:
      - "api/bot-toggle.ts"
      - "api/risk-policy.ts"
      - "src/App.tsx"
      - "src/components/RiskAndControlsView.tsx"
      - "src/services/api.ts"
      - "vercel.json"
      - ".github/workflows/risk-controls-contract-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
